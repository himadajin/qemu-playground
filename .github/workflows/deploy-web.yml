name: Deploy web

# apps/api and runner are self-hosted and deployed manually (see
# docs/user/self-hosting.md); this workflow only ever deploys the static
# frontend (apps/web) to Cloudflare Workers.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Deploying needs the repository secrets CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions).
      # Until they are set, every later step is skipped so merges to main
      # stay green instead of failing on wrangler authentication.
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.configured == 'true'

      - run: npm run typecheck --workspace @qemu-playground/shared --workspace @qemu-playground/web
        if: steps.creds.outputs.configured == 'true'

      - run: npm run test --workspace @qemu-playground/shared --workspace @qemu-playground/web
        if: steps.creds.outputs.configured == 'true'

      - run: npm run build --workspace @qemu-playground/web
        if: steps.creds.outputs.configured == 'true'

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.configured == 'true'
        working-directory: apps/web
        run: npx wrangler deploy
